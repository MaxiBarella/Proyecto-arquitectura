# Arranque local del sistema: los cuatro servicios y sus dependencias.
# Uso: copiar .env.example como .env y correr `docker compose up --build`.

# Lo común de las dos instancias de Vuelos (12.1). Las usan vuelos-1 y vuelos-2.
x-vuelos-entorno: &vuelos-entorno
  PORT: "8080"
  MYSQL_DSN: ${MYSQL_VUELOS_USER:?falta en .env}:${MYSQL_VUELOS_PASSWORD:?falta en .env}@tcp(mysql-vuelos:3306)/vuelos?parseTime=true&loc=UTC
  OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
  PISTAS_URL: http://pistas:8080
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?falta en .env}:${RABBITMQ_PASSWORD:?falta en .env}@rabbitmq:5672
  # Proveedor de los avisos por mail (27.1, ADR-009). Sin NOTIFICACIONES_URL en el
  # .env se usa el mock local; para la presentación, la URL real de Recién hecho.
  NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-http://notificaciones-mock:4010}
  NOTIFICACIONES_API_KEY: ${NOTIFICACIONES_API_KEY:-prueba}
  AEROLINEAS_EMAILS: ${AEROLINEAS_EMAILS:?falta en .env}

x-vuelos: &vuelos
  build: ./services/vuelos
  image: aeropuerto-vuelos
  depends_on:
    # Vuelos arranca recién cuando MySQL acepta conexiones.
    mysql-vuelos:
      condition: service_healthy
    rabbitmq-init:
      condition: service_completed_successfully
    solr:
      condition: service_started
    grafana:
      condition: service_started
    pistas:
      condition: service_started

services:
  # Gateway y balanceador (15.1, 15.3): la entrada al sistema. Sirve el frontend, verifica el
  # token, manda cada pedido a su servicio con la identidad en encabezados y limita el tráfico
  # (nginx/README.md).
  nginx:
    # Se construye desde la raíz porque también compila el frontend (frontend/).
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?falta en .env}
      # Límite por IP (15.8). Para las pruebas de carga se sube en el .env.
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-20}
      GATEWAY_RATE_BURST: ${GATEWAY_RATE_BURST:-40}
    ports:
      - "8080:80"
    depends_on:
      - vuelos-1
      - vuelos-2
      - pistas
      - usuarios
      - clima

  # Vuelos corre en dos instancias iguales detrás de NGINX (12.1, ADR-012). La configuración
  # es la misma (x-vuelos, al principio del archivo); cambia solo el nombre de cada una, que
  # Grafana usa para mostrar el reparto (service.instance.id).
  vuelos-1:
    <<: *vuelos
    environment:
      <<: *vuelos-entorno
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=vuelos-1
    # El puerto directo queda hasta que Usuarios emita tokens (15.20).
    ports:
      - "8081:8080"

  vuelos-2:
    <<: *vuelos
    environment:
      <<: *vuelos-entorno
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=vuelos-2

  pistas:
    build: ./services/pistas
    environment:
      PORT: "8080"
      MYSQL_DSN: ${MYSQL_PISTAS_USER:?falta en .env}:${MYSQL_PISTAS_PASSWORD:?falta en .env}@tcp(mysql-pistas:3306)/pistas?parseTime=true&loc=UTC
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?falta en .env}:${RABBITMQ_PASSWORD:?falta en .env}@rabbitmq:5672
    ports:
      - "8082:8080"
    depends_on:
      # Pistas arranca recién cuando MySQL acepta conexiones.
      mysql-pistas:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  clima:
    build: ./services/clima
    environment:
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      MONGO_URI: mongodb://${MONGO_CLIMA_USER}:${MONGO_CLIMA_PASSWORD}@mongo-clima:27017
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_ENABLED: "true"
      CLIMA_API_KEYS: ${CLIMA_API_KEYS:?falta en .env}
    ports:
      - "8083:8080"
    depends_on:
      mongo-clima:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  usuarios:
    build: ./services/usuarios
    environment:
      PORT: "8080"
      MYSQL_DSN: ${MYSQL_USUARIOS_USER:?falta en .env}:${MYSQL_USUARIOS_PASSWORD:?falta en .env}@tcp(mysql-usuarios:3306)/usuarios?parseTime=true&loc=UTC
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      # La misma clave la usa NGINX para verificar los tokens (15.17).
      JWT_SECRET: ${JWT_SECRET:?falta en .env}
      # Contraseñas de las cuentas de prueba (15.15).
      USUARIOS_OPERADOR_PASSWORD: ${USUARIOS_OPERADOR_PASSWORD:?falta en .env}
      USUARIOS_AEROLINEAS_PASSWORD: ${USUARIOS_AEROLINEAS_PASSWORD:?falta en .env}
      USUARIOS_LATAM_PASSWORD: ${USUARIOS_LATAM_PASSWORD:?falta en .env}
    ports:
      - "8084:8080"
    depends_on:
      # Usuarios arranca recién cuando MySQL acepta conexiones.
      mysql-usuarios:
        condition: service_healthy
      grafana:
        condition: service_started

  mysql-vuelos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vuelos
      MYSQL_ROOT_PASSWORD: ${MYSQL_VUELOS_ROOT_PASSWORD:?falta en .env}
      # Usuario propio de Vuelos, con acceso solo a la base vuelos.
      MYSQL_USER: ${MYSQL_VUELOS_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_VUELOS_PASSWORD:?falta en .env}
    volumes:
      - mysql-vuelos-data:/var/lib/mysql
      # Las tablas se crean la primera vez que arranca la base.
      - ./services/vuelos/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-pistas:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pistas
      MYSQL_ROOT_PASSWORD: ${MYSQL_PISTAS_ROOT_PASSWORD:?falta en .env}
      # Usuario propio de Pistas, con acceso solo a la base pistas.
      MYSQL_USER: ${MYSQL_PISTAS_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_PISTAS_PASSWORD:?falta en .env}
    volumes:
      - mysql-pistas-data:/var/lib/mysql
      # Las tablas se crean la primera vez que arranca la base.
      - ./services/pistas/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-usuarios:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: usuarios
      MYSQL_ROOT_PASSWORD: ${MYSQL_USUARIOS_ROOT_PASSWORD:?falta en .env}
      # Usuario propio de Usuarios, con acceso solo a la base usuarios (15.16).
      MYSQL_USER: ${MYSQL_USUARIOS_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_USUARIOS_PASSWORD:?falta en .env}
    volumes:
      - mysql-usuarios-data:/var/lib/mysql
      # La tabla se crea la primera vez que arranca la base.
      - ./services/usuarios/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-clima:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_CLIMA_USER:?falta en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CLIMA_PASSWORD:?falta en .env}
    volumes:
      - mongo-clima-data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?falta en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta en .env}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Carga las colas, sus uniones y las colas de fallidos (rabbitmq/README.md, 4.13).
  # Corre una vez, cuando RabbitMQ está listo, y termina. Los servicios esperan a que termine.
  rabbitmq-init:
    image: curlimages/curl:8.11.1
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?falta en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    command:
      - sh
      - -c
      - >-
        curl --fail --silent --show-error
        --retry 20 --retry-delay 2 --retry-all-errors
        -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -H "content-type: application/json"
        -X POST --data @/definitions.json
        http://rabbitmq:15672/api/definitions
        && echo "definiciones de RabbitMQ cargadas"
    depends_on:
      rabbitmq:
        condition: service_healthy

  solr:
    image: solr:9
    # Crea el core "vuelos" con la configuración de solr/ (20.5), solo si todavía no existe.
    # Si cambia la configuración, hay que borrar el volumen: docker volume rm <proyecto>_solr-data.
    command: ["solr-precreate", "vuelos", "/opt/solr/server/solr/configsets/vuelos"]
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
      - ./solr/vuelos:/opt/solr/server/solr/configsets/vuelos:ro

  # Mock del proveedor de notificaciones (Recién hecho), hecho con Prism a partir de su
  # contrato (ADR-009). Valida cada pedido contra el contrato y no manda mails. Sirve
  # para el desarrollo, las pruebas de carga (su límite es de 60 por minuto) y para
  # simular la caída del proveedor: docker compose stop notificaciones-mock.
  notificaciones-mock:
    image: stoplight/prism:5
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "-m", "false", "/contrato/notificaciones.yaml"]
    volumes:
      - ./services/vuelos/internal/adapters/notificaciones/testdata/notificaciones.yaml:/contrato/notificaciones.yaml:ro

  grafana:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3001:3000"
      - "4318:4318"
    volumes:
      # Las alertas guardadas en el repo se cargan al arrancar (20.4).
      - ./grafana/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      - ./grafana/dashboards/aeropuerto.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/aeropuerto.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/aeropuerto-dashboards:ro

  # Pruebas de carga (ADR-013). No arranca con el resto: se corre a mano, por ejemplo
  #   docker compose --profile carga run --rm k6 run /carga/tablero.js
  # Le pega a NGINX por la red interna y manda sus métricas a Grafana (16.5).
  k6:
    image: grafana/k6:2.3.0
    profiles: [carga]
    environment:
      BASE_URL: http://nginx
      JWT_SECRET: ${JWT_SECRET:?falta en .env}
      K6_OUT: opentelemetry
      K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
      K6_OTEL_HTTP_EXPORTER_ENDPOINT: grafana:4318
      K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
      K6_OTEL_SERVICE_NAME: k6
    volumes:
      - ./tests/carga:/carga:ro
      - ./tests/carga/resultados:/resultados

volumes:
  mysql-vuelos-data:
  mysql-pistas-data:
  mysql-usuarios-data:
  mongo-clima-data:
  solr-data:
