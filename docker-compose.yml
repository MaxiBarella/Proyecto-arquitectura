# Arranque local del sistema: los cuatro servicios y sus dependencias.
# Uso: copiar .env.example como .env y correr `docker compose up --build`.

services:
  vuelos:
    build: ./services/vuelos
    environment:
      PORT: "8080"
      MYSQL_DSN: ${MYSQL_VUELOS_USER:?falta en .env}:${MYSQL_VUELOS_PASSWORD:?falta en .env}@tcp(mysql-vuelos:3306)/vuelos?parseTime=true&loc=UTC
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      PISTAS_URL: http://pistas:8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?falta en .env}:${RABBITMQ_PASSWORD:?falta en .env}@rabbitmq:5672
    ports:
      - "8081:8080"
    depends_on:
      # Vuelos arranca recién cuando MySQL acepta conexiones.
      mysql-vuelos:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      solr:
        condition: service_started
      grafana:
        condition: service_started
      pistas:
        condition: service_started

  pistas:
    build: ./services/pistas
    environment:
      PORT: "8080"
      MYSQL_DSN: ${MYSQL_PISTAS_USER:?falta en .env}:${MYSQL_PISTAS_PASSWORD:?falta en .env}@tcp(mysql-pistas:3306)/pistas?parseTime=true&loc=UTC
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?falta en .env}:${RABBITMQ_PASSWORD:?falta en .env}@rabbitmq:5672
    ports:
      - "8082:8080"
    depends_on:
      # Pistas arranca recién cuando MySQL acepta conexiones.
      mysql-pistas:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  clima:
    build: ./services/clima
    environment:
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      MONGO_URI: mongodb://${MONGO_CLIMA_USER}:${MONGO_CLIMA_PASSWORD}@mongo-clima:27017
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_ENABLED: "true"
      CLIMA_API_KEYS: ${CLIMA_API_KEYS:?falta en .env}
    ports:
      - "8083:8080"
    depends_on:
      mongo-clima:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  usuarios:
    build: ./services/usuarios
    environment:
      PORT: "8080"
    ports:
      - "8084:8080"
    depends_on:
      - mysql-usuarios

  mysql-vuelos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vuelos
      MYSQL_ROOT_PASSWORD: ${MYSQL_VUELOS_ROOT_PASSWORD:?falta en .env}
      # Usuario propio de Vuelos, con acceso solo a la base vuelos.
      MYSQL_USER: ${MYSQL_VUELOS_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_VUELOS_PASSWORD:?falta en .env}
    volumes:
      - mysql-vuelos-data:/var/lib/mysql
      # Las tablas se crean la primera vez que arranca la base.
      - ./services/vuelos/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-pistas:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pistas
      MYSQL_ROOT_PASSWORD: ${MYSQL_PISTAS_ROOT_PASSWORD:?falta en .env}
      # Usuario propio de Pistas, con acceso solo a la base pistas.
      MYSQL_USER: ${MYSQL_PISTAS_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_PISTAS_PASSWORD:?falta en .env}
    volumes:
      - mysql-pistas-data:/var/lib/mysql
      # Las tablas se crean la primera vez que arranca la base.
      - ./services/pistas/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-usuarios:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: usuarios
      MYSQL_ROOT_PASSWORD: ${MYSQL_USUARIOS_ROOT_PASSWORD:?falta en .env}
    volumes:
      - mysql-usuarios-data:/var/lib/mysql

  mongo-clima:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_CLIMA_USER:?falta en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CLIMA_PASSWORD:?falta en .env}
    volumes:
      - mongo-clima-data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?falta en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta en .env}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Carga las colas, sus uniones y las colas de fallidos (rabbitmq/README.md, 4.13).
  # Corre una vez, cuando RabbitMQ está listo, y termina. Los servicios esperan a que termine.
  rabbitmq-init:
    image: curlimages/curl:8.11.1
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?falta en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    command:
      - sh
      - -c
      - >-
        curl --fail --silent --show-error
        --retry 20 --retry-delay 2 --retry-all-errors
        -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -H "content-type: application/json"
        -X POST --data @/definitions.json
        http://rabbitmq:15672/api/definitions
        && echo "definiciones de RabbitMQ cargadas"
    depends_on:
      rabbitmq:
        condition: service_healthy

  solr:
    image: solr:9
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr

  grafana:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3001:3000"
      - "4318:4318"

volumes:
  mysql-vuelos-data:
  mysql-pistas-data:
  mysql-usuarios-data:
  mongo-clima-data:
  solr-data:
