# Balanceo (12, ADR-012): las instancias de Vuelos detrás de NGINX.
#
# Por ahora hay una sola. La segunda instancia, cuándo se da por caída y cuánto se espera
# su respuesta llegan en su propio pull request (ver "Pendiente" en el ADR-012).
upstream vuelos {
    zone vuelos 64k;
    server vuelos:8080 resolve;
}
