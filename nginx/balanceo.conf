# Balanceo (12, ADR-012): las dos instancias de Vuelos detrás de NGINX.
#
# - Reparte por turnos, que es lo que NGINX hace si no se le dice otra cosa (12.2).
# - Detección pasiva: si un pedido a una instancia falla (no conecta o no responde a tiempo),
#   la da por caída y durante 10 segundos manda todo a la otra. Después la vuelve a probar
#   con un pedido (12.4).
# - Si el pedido falló antes de llegar, o es un GET, lo reintenta en la otra instancia. Un
#   POST que ya se mandó no lo reintenta: no sabe si se aplicó (ADR-012).
# - Cuánto espera a cada instancia está en gateway.conf (12.5): proxy_connect_timeout y
#   proxy_read_timeout se configuran donde se manda el pedido, no acá.
upstream vuelos {
    zone vuelos 64k;
    server vuelos-1:8080 resolve max_fails=1 fail_timeout=10s;
    server vuelos-2:8080 resolve max_fails=1 fail_timeout=10s;
}
