# Configuración principal de NGINX. Solo carga lo común; las dos funciones van cada una
# en su archivo, como recomendó el profe (15.3):
#   - balanceo.conf: las instancias de Vuelos (12).
#   - gateway.conf: rutas, token y límite de tráfico (15).

# Módulo njs, para verificar el token con jwt.js (15.4).
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /run/nginx.pid;

# NGINX borra las variables de entorno al arrancar. Esta línea deja pasar la clave del token
# para que jwt.js la pueda leer (15.5).
env JWT_SECRET;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Un log en JSON por pedido, como el resto del sistema (11). "upstream" dice qué contenedor
    # atendió el pedido: con dos instancias de Vuelos muestra el reparto (12).
    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"duration_s":$request_time,'
        '"upstream":"$upstream_addr",'
        '"user_id":"$jwt_sub",'
        '"token":"$jwt_motivo",'
        '"client":"$remote_addr",'
        '"traceparent":"$http_traceparent"}';
    access_log  /var/log/nginx/access.log  json;

    sendfile        on;
    keepalive_timeout  65;

    # El DNS de Docker. Con "resolve" en cada upstream, NGINX vuelve a preguntar la dirección de
    # cada servicio cada 10 segundos: si un contenedor se reinicia con otra IP, lo sigue
    # encontrando, y si todavía no arrancó, NGINX arranca igual.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/balanceo.conf;
    include /etc/nginx/conf.d/gateway.conf;
}
