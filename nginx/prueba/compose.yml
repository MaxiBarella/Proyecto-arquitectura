# Prueba del gateway sin levantar el sistema entero: NGINX delante de un servicio falso
# que responde con lo que le llega. La corre nginx/prueba/prueba.sh.
name: gateway-prueba

services:
  gateway:
    build:
      context: ../..
      dockerfile: nginx/Dockerfile
    environment:
      JWT_SECRET: clave-de-la-prueba-del-gateway-0123456789
    ports:
      - "18080:80"
    depends_on:
      - servicio-falso

  servicio-falso:
    image: nginx:1.28-alpine
    volumes:
      - ./servicio-falso.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [vuelos, pistas, usuarios, clima]
