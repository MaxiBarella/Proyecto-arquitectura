# Hace de los cuatro servicios en la prueba del gateway: responde qué le llegó.
# "servicio" es el Host que pone NGINX, o sea, el nombre del upstream al que mandó el pedido.
server {
    listen 8080;
    default_type application/json;

    location / {
        return 200 '{"servicio":"$host","uri":"$request_uri","user_id":"$http_x_user_id","role":"$http_x_user_role","airline":"$http_x_airline"}';
    }
}
